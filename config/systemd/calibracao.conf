# /etc/systemd/system/fprintd.service.d/calibracao.conf
# O sensor do Inspiron 5590 é mais "claro" que o do autor do driver (Inspiron 3501):
# a leitura satura na calibração. Escurecer 8 passos de DAC resolve.
[Service]
Environment=GOODIX53XD_DAC_OFFSET=8
# Diagnóstico (opcional): notas no journal  -> journalctl -u fprintd | grep score
#Environment=G_MESSAGES_DEBUG=libfprint-print
# Diagnóstico (opcional, dados biométricos!): grava cada toque como imagem
#Environment=GOODIX53XD_DUMP_DIR=/var/lib/fprint/dump
