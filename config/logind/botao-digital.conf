# /etc/systemd/logind.conf.d/botao-digital.conf
# No Inspiron 5590 o leitor fica no botão de ligar: apertar forte = "power key".
# Toque curto não faz nada; segurar 4+ s continua forçando o desligamento (hardware).
# No Cinnamon também: gsettings set org.cinnamon.settings-daemon.plugins.power button-power nothing
# (GNOME: org.gnome.settings-daemon.plugins.power power-button-action 'nothing'; KDE: Energia > Botão de ligar)
[Login]
HandlePowerKey=ignore
