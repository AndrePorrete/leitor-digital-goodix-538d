name: Bundle

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
      - name: Git and certificates
        run: apt-get update -qq && apt-get install -y -qq git ca-certificates >/dev/null
      - uses: actions/checkout@v4
      - name: Cache OpenSSL / OpenCV
        uses: actions/cache@v4
        with:
          path: /var/tmp/fprint-538d-build/deps
          key: deps-v2-${{ hashFiles('construir/construir.sh') }}
      - name: Build
        run: bash construir/construir.sh
      - uses: actions/upload-artifact@v4
        with:
          name: fprint-538d-x86_64
          path: dist/*

  distros:
    # The bundle must load on every supported distribution family
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:22.04
          - ubuntu:24.04
          - debian:12
          - fedora:40
          - fedora:41
          - archlinux:latest
          - opensuse/tumbleweed
          - opensuse/leap:15.6
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fprint-538d-x86_64
      - name: Runtime libraries of the distribution fprintd
        run: |
          if command -v apt-get; then apt-get update -qq && apt-get install -y -qq fprintd libpam-fprintd >/dev/null
          elif command -v dnf; then dnf install -y -q fprintd fprintd-pam
          elif command -v pacman; then pacman -Sy --noconfirm --needed fprintd >/dev/null
          elif command -v zypper; then zypper -n -q install fprintd fprintd-pam tar gzip; fi
      - name: Bundle runs
        run: |
          tar -xzf fprint-538d-x86_64.tar.gz
          ldd fprint-538d/libexec/fprintd | grep -i 'not found' && exit 1
          LD_BIND_NOW=1 fprint-538d/libexec/fprintd --help >/dev/null && echo "fprintd loads OK"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, distros]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fprint-538d-x86_64
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes "Install: see README" fprint-538d-x86_64.tar.gz fprint-538d-x86_64.tar.gz.sha256
